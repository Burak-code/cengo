<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Cengo Chat - Gelişmiş Oda & Profil</title>
    <style>
        :root {
            --bg-color: #efeae2;
            --sidebar-bg: #f0f2f5;
            --chat-bg: #fff;
            --header-bg: #075e54;
            --header-text: #fff;
            --msg-rcv: #fff;
            --text-color: #000;
            --input-bg: #f0f0f0;
            --border-color: #d1d7db;
            --brand-bg: #111b21;
        }

        [data-theme="dark"] {
            --bg-color: #0b141a;
            --sidebar-bg: #111b21;
            --chat-bg: #0b141a;
            --header-bg: #202c33;
            --header-text: #e9edef;
            --msg-rcv: #202c33;
            --text-color: #e9edef;
            --input-bg: #202c33;
            --border-color: #222d34;
            --brand-bg: #060a0e;
        }

        body { font-family: sans-serif; background: var(--bg-color); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: var(--text-color); transition: 0.3s; }
        .app-container { width: 980px; height: 720px; background: var(--chat-bg); display: flex; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); overflow: hidden; border: 1px solid var(--border-color); position: relative; }
        
        /* EN SOLDAKİ AFİLLİ BRANDING ŞERİDİ */
        .brand-sidebar { width: 60px; background: var(--brand-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 15px 0; z-index: 10; }
        .brand-top, .brand-bottom { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .brand-icon { width: 38px; height: 38px; border-radius: 50%; background: var(--header-bg); display: flex; align-items: center; justify-content: center; color: #fff; text-decoration: none; font-size: 18px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: 0.2s; position: relative; }
        .brand-icon:hover { transform: scale(1.1); opacity: 0.9; }
        
        .brand-icon::after { content: attr(data-tooltip); position: absolute; left: 55px; background: #202c33; color: #e9edef; padding: 5px 10px; font-size: 11px; border-radius: 4px; white-space: nowrap; opacity: 0; pointer-events: none; transition: 0.2s; border: 1px solid var(--border-color); z-index: 100; }
        .brand-icon:hover::after { opacity: 1; }

        /* Sol Panel (Odalar) */
        .sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; transition: 0.3s; }
        .sidebar.collapsed { width: 0; overflow: hidden; border: none; }
        .sidebar-header { padding: 15px; background: var(--header-bg); color: var(--header-text); font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        
        /* Profil Alanı */
        .profile-box { padding: 10px 15px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; background: var(--chat-bg); }
        .profile-pic { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; background: #ccc; cursor: pointer; border: 1px solid var(--border-color); }

        .room-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .room-item { padding: 8px 10px; background: var(--chat-bg); border-radius: 6px; cursor: pointer; border: 1px solid var(--border-color); font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .room-item:hover { opacity: 0.8; }
        .room-item.active { background: #005c4b; font-weight: bold; color: #fff; }
        .room-actions { display: flex; gap: 5px; }
        .room-actions button { background: none; border: none; cursor: pointer; font-size: 14px; opacity: 0.7; }
        .room-actions button:hover { opacity: 1; }
        
        .sidebar-footer { padding: 10px; background: var(--sidebar-bg); border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 5px; }
        .sidebar-footer input { padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--chat-bg); color: var(--text-color); outline: none; font-size: 13px; }

        /* Sağ Panel (Sohbet) */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); }
        .chat-header { background: var(--header-bg); color: var(--header-text); padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: var(--bg-color); }
        .msg { display: flex; gap: 10px; max-width: 80%; align-self: flex-start; }
        .msg.my-msg { align-self: flex-end; flex-direction: row-reverse; }
        
        .msg-pp { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; margin-top: 2px; }
        
        /* Baloncuk ve altındaki mini isim */
        .msg-content { padding: 8px 12px 4px 12px; border-radius: 8px; word-break: break-all; box-shadow: 0 1px 0.5px rgba(0,0,0,0.1); color: #000; position: relative; }
        .msg-author-tag { font-size: 9px; opacity: 0.7; display: block; text-align: right; margin-top: 2px; font-weight: bold; }

        .msg-content img { max-width: 100%; border-radius: 6px; margin-top: 5px; display: block; }
        .msg-content audio { width: 100%; margin-top: 5px; }
        .file-link { display: block; color: inherit; text-decoration: underline; margin-top: 5px; font-weight: bold; }

        .chat-input { padding: 10px; display: flex; gap: 5px; background: var(--input-bg); align-items: center; border-top: 1px solid var(--border-color); }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; outline: none; background: var(--chat-bg); color: var(--text-color); }
        .btn { background: var(--header-bg); color: var(--header-text); border: none; padding: 10px 14px; border-radius: 4px; cursor: pointer; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
</head>
<body>

<div class="app-container">
    
    <!-- EN SOLDAKİ BRANDING (İMZA) ŞERİDİ -->
    <div class="brand-sidebar">
        <div class="brand-top">
            <a href="https://instagram.com/burak_msz" target="_blank" class="brand-icon" data-tooltip="created by @burak_msz (Instagram)">🅾 </a>
            <a href="https://burak-code.github.io/msz/" target="_blank" class="brand-icon" data-tooltip="Web Sitem">🌐</a>
        </div>
        <div class="brand-bottom">
            <span style="font-size: 10px; color: gray; writing-mode: vertical-lr; transform: rotate(180deg);">MSZ v1</span>
        </div>
    </div>

    <!-- SOL PANEL (ODALAR) -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>Odalar</span>
            <button class="btn" onclick="toggleTheme()" style="padding: 4px 8px; font-size: 12px;">☀️/🌙</button>
        </div>
        
        <!-- Profil Alanı -->
        <div class="profile-box">
            <input type="file" id="ppInput" style="display:none" onchange="changeProfilePic(this)">
            <img src="" id="myProfilePic" class="profile-pic" onclick="document.getElementById('ppInput').click()" title="PP Değiştirmek için tıkla">
            <div style="cursor: pointer;" onclick="changeUsername()" title="İsmi değiştirmek için tıkla">
                <div id="sidebarUsername" style="font-weight: bold; font-size: 14px;">Kullanıcı</div>
                <div style="font-size: 11px; color: gray;">Değiştir ✏️</div>
            </div>
        </div>

        <div class="room-list" id="roomList"></div>
        
        <div class="sidebar-footer">
            <input type="text" id="newRoomInput" placeholder="Oda Adı...">
            <input type="password" id="newRoomPass" placeholder="Şifre (Opsiyonel)">
            <button class="btn" onclick="createRoom()">Oda Oluştur</button>
        </div>
    </div>

    <!-- SAĞ PANEL (SOHBET) -->
    <div class="chat-area">
        <div class="chat-header">
            <div class="header-left">
                <button class="btn" onclick="toggleSidebar()" style="padding: 6px 10px;">☰</button>
                <span id="currentRoomTitle">Oda Seçilmedi</span>
            </div>
            <span id="userInfo" style="font-size: 12px; font-weight: normal;"></span>
        </div>
        
        <div class="chat-messages" id="chat">
            <div style="text-align: center; color: gray; margin-top: 50px;">Soldan bir oda seçin veya yeni oda oluşturun.</div>
        </div>
        
        <div class="chat-input" id="chatInputArea" style="display: none;">
            <input type="file" id="fileInput" style="display:none" onchange="handleFile(this)">
            <button class="btn" onclick="document.getElementById('fileInput').click()">📎</button>
            <input type="text" id="msgText" placeholder="Mesaj yaz..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button class="btn" onclick="sendMessage()">Gönder</button>
        </div>
    </div>
</div>

<script>
    let username = localStorage.getItem("cengo_username") || prompt("Adını gir:") || ("Misafir_" + Math.floor(Math.random()*100));
    localStorage.setItem("cengo_username", username);

    let myProfileData = "https://www.w3schools.com/howto/img_avatar.png";
    
    document.getElementById("sidebarUsername").innerText = username;
    document.getElementById("userInfo").innerText = username;
    document.getElementById("myProfilePic").src = myProfileData;

    let client = null;
    let currentTopic = null;
    let currentRoomName = null;

    // "Genel Sohbet" daima varsayılan ve silinemez olarak başta yer alır
    let rooms = JSON.parse(localStorage.getItem("cengo_rooms")) || {
        "Genel Sohbet": ""
    };
    rooms["Genel Sohbet"] = ""; // Garanti olsun

    function saveRooms() {
        localStorage.setItem("cengo_rooms", JSON.stringify(rooms));
    }

    // Kullanıcı adına göre sabit renk paleti oluşturan fonksiyon (Yeşil, Mavi, Kırmızı, Gri, Turuncu vb.)
    const bubbleColors = ["#dcf8c6", "#a8d8ea", "#ffb4a2", "#e3e3e3", "#ffd166", "#c7ceea", "#ff9aa2"];
    function getUserColor(name) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
            hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        let index = Math.abs(hash) % bubbleColors.length;
        return bubbleColors[index];
    }

    function initMQTT() {
        client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        
        client.on('connect', () => {
            client.subscribe('cengo/room-list-sync');
            client.publish('cengo/room-list-sync', JSON.stringify({ type: 'get_rooms' }));
        });

        client.on('message', (top, message) => {
            if (top === 'cengo/room-list-sync') {
                const data = JSON.parse(message.toString());
                if (data.type === 'room_sync') {
                    rooms = data.rooms;
                    rooms["Genel Sohbet"] = ""; // Genel sohbetin silinmesini engelle
                    saveRooms();
                    renderRooms();
                } else if (data.type === 'get_rooms') {
                    client.publish('cengo/room-list-sync', JSON.stringify({ type: 'room_sync', rooms: rooms }));
                }
            } else if (top === currentTopic) {
                displayMessage(JSON.parse(message.toString()));
            }
        });
    }
    initMQTT();

    function changeUsername() {
        const newName = prompt("Yeni adını gir:", username);
        if (newName && newName.trim() !== "") {
            username = newName.trim();
            localStorage.setItem("cengo_username", username);
            document.getElementById("sidebarUsername").innerText = username;
            document.getElementById("userInfo").innerText = username;
            alert("Adın güncellendi!");
        }
    }

    function renderRooms() {
        const roomListDiv = document.getElementById("roomList");
        roomListDiv.innerHTML = "";
        for (let roomName in rooms) {
            const div = document.createElement("div");
            div.className = `room-item ${currentRoomName === roomName ? 'active' : ''}`;
            
            let lockIcon = rooms[roomName] ? " 🔒" : "";
            
            // "Genel Sohbet" için ayar ve silme butonları gösterilmez (Özel/Klasik kalır)
            let actionButtons = '';
            if (roomName !== "Genel Sohbet") {
                actionButtons = `
                    <div class="room-actions">
                        <button onclick="editRoom('${roomName}')" title="Oda Ayarları">⚙️</button>
                        <button onclick="deleteRoom('${roomName}')" title="Odayı Sil">🗑️</button>
                    </div>
                `;
            }

            div.innerHTML = `
                <span style="flex:1; cursor:pointer;" onclick="tryJoinRoom('${roomName}')"># ${roomName}${lockIcon}</span>
                ${actionButtons}
            `;
            roomListDiv.appendChild(div);
        }
    }

    function tryJoinRoom(roomName) {
        const roomPass = rooms[roomName];
        if (roomPass) {
            const entered = prompt(`"${roomName}" odası şifreli. Şifreyi girin:`);
            if (entered !== roomPass) {
                alert("Şifre yanlış!");
                return;
            }
        }
        joinRoom(roomName);
    }

    function joinRoom(roomName) {
        currentRoomName = roomName;
        const newTopic = 'cengo/rooms/' + roomName;
        if (currentTopic) {
            client.unsubscribe(currentTopic);
        }
        currentTopic = newTopic;
        client.subscribe(currentTopic);
        
        document.getElementById("currentRoomTitle").innerText = "# " + roomName;
        document.getElementById("chatInputArea").style.display = "flex";
        document.getElementById("chat").innerHTML = "";
        renderRooms();
    }

    function createRoom() {
        const input = document.getElementById("newRoomInput");
        const passInput = document.getElementById("newRoomPass");
        const roomName = input.value.trim();
        const roomPass = passInput.value.trim();
        
        if (!roomName) return;
        if (roomName === "Genel Sohbet") {
            alert("Bu isim zaten varsayılan odadır!");
            return;
        }

        if (!rooms[roomName]) {
            rooms[roomName] = roomPass;
            saveRooms();
            client.publish('cengo/room-list-sync', JSON.stringify({ type: 'room_sync', rooms: rooms }));
            input.value = "";
            passInput.value = "";
            renderRooms();
            joinRoom(roomName);
        } else {
            alert("Bu oda zaten var!");
        }
    }

    function editRoom(roomName) {
        const currentPass = rooms[roomName] || "";
        const newName = prompt("Yeni oda adını girin:", roomName);
        if (!newName || !newName.trim()) return;
        const trimmedNewName = newName.trim();

        if (trimmedNewName === "Genel Sohbet") {
            alert("Bu ismi kullanamazsınız!");
            return;
        }

        const newPass = prompt("Yeni şifre belirleyin (Şifresiz yapmak için boş bırakın):", currentPass);

        if (trimmedNewName !== roomName && rooms[trimmedNewName]) {
            alert("Bu isimde başka bir oda zaten var!");
            return;
        }

        delete rooms[roomName];
        rooms[trimmedNewName] = newPass !== null ? newPass.trim() : currentPass;
        
        saveRooms();
        client.publish('cengo/room-list-sync', JSON.stringify({ type: 'room_sync', rooms: rooms }));
        renderRooms();

        if (currentRoomName === roomName) {
            joinRoom(trimmedNewName);
        }
    }

    function deleteRoom(roomName) {
        if (roomName === "Genel Sohbet") return;
        if (confirm(`"${roomName}" odasını silmek istediğine emin misin?`)) {
            delete rooms[roomName];
            saveRooms();
            client.publish('cengo/room-list-sync', JSON.stringify({ type: 'room_sync', rooms: rooms }));
            renderRooms();

            if (currentRoomName === roomName) {
                joinRoom("Genel Sohbet");
            }
        }
    }

    function changeProfilePic(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            myProfileData = e.target.result;
            document.getElementById("myProfilePic").src = myProfileData;
        };
        reader.readAsDataURL(file);
    }

    function sendMessage() {
        const text = document.getElementById("msgText").value;
        if (!text || !currentTopic) return;
        
        const payload = JSON.stringify({ 
            type: 'text', 
            gonderen: username, 
            pp: myProfileData,
            content: text 
        });
        client.publish(currentTopic, payload);
        document.getElementById("msgText").value = "";
    }

    function handleFile(input) {
        const file = input.files[0];
        if (!file || !currentTopic) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            let fileType = 'file';
            if (file.type.startsWith('image/')) fileType = 'image';
            else if (file.type.startsWith('audio/')) fileType = 'audio';

            const payload = JSON.stringify({
                type: fileType,
                gonderen: username,
                pp: myProfileData,
                content: e.target.result,
                fileName: file.name
            });
            client.publish(currentTopic, payload);
        };
        reader.readAsDataURL(file);
        input.value = "";
    }

    function displayMessage(data) {
        const chatDiv = document.getElementById("chat");
        const isMe = data.gonderen === username;
        
        const msgDiv = document.createElement("div");
        msgDiv.className = "msg " + (isMe ? "my-msg" : "");
        
        const ppImg = document.createElement("img");
        ppImg.className = "msg-pp";
        ppImg.src = data.pp || "https://www.w3schools.com/howto/img_avatar.png";
        
        const contentDiv = document.createElement("div");
        contentDiv.className = "msg-content";
        
        // Kullanıcıya özel renk ataması (Her kullanıcıya farklı renk balonu)
        contentDiv.style.backgroundColor = getUserColor(data.gonderen);
        
        let innerHTML = '';
        if (data.type === 'text') {
            innerHTML += `<span>${data.content}</span>`;
        } else if (data.type === 'image') {
            innerHTML += `<img src="${data.content}">`;
        } else if (data.type === 'audio') {
            innerHTML += `<audio controls src="${data.content}"></audio>`;
        } else {
            innerHTML += `<a class="file-link" href="${data.content}" download="${data.fileName}">📄 ${data.fileName} (İndir)</a>`;
        }
        
        // Mesajın altında küçücük isim etiketi
        innerHTML += `<span class="msg-author-tag">~ ${data.gonderen}</span>`;
        
        contentDiv.innerHTML = innerHTML;
        msgDiv.appendChild(ppImg);
        msgDiv.appendChild(contentDiv);
        
        chatDiv.appendChild(msgDiv);
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        sidebar.classList.toggle("collapsed");
    }

    function toggleTheme() {
        const html = document.documentElement;
        if (html.getAttribute("data-theme") === "dark") {
            html.removeAttribute("data-theme");
        } else {
            html.setAttribute("data-theme", "dark");
        }
    }

    // İlk açılışta otomatik Genel Sohbet'e bağla
    renderRooms();
    joinRoom("Genel Sohbet");
</script>
</body>
</html>
